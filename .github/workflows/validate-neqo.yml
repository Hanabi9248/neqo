name: Validate QPACK peer capacity
on:
  push:
    branches: [codex/validate-qpack]
permissions:
  contents: read
jobs:
  broad:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c65f24236237531350688f81daf22645fd7dd0
          persist-credentials: false
      - uses: ./.github/actions/install-build-deps
        with:
          components: clippy
          tools: cargo-hack,cargo-deny,cargo-machete
      - name: Workspace tests
        run: cargo test --locked --features ci
      - name: Feature combinations
        if: always()
        run: cargo hack clippy --locked --feature-powerset --all-targets --exclude-features gecko,ci --mutually-exclusive-features bench,blapi,build-fuzzing-corpus,default,disable-encryption -- -D warnings
      - name: Documentation
        if: always()
        env:
          RUSTDOCFLAGS: --deny rustdoc::broken_intra_doc_links --deny warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items
      - name: Dependency checks
        if: always()
        run: |
          cargo deny check advisories
          cargo deny check bans licenses sources
          cargo machete --with-metadata
          cargo hack --workspace --no-manifest-path machete --with-metadata
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c65f24236237531350688f81daf22645fd7dd0
          persist-credentials: false
      - uses: mozilla/actions/rust@264c6b750df669adb58286a26c5d0e04e839e06b
        with:
          version: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check
  qpack:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c65f24236237531350688f81daf22645fd7dd0
          persist-credentials: false
      - uses: ./.github/actions/install-build-deps
      - name: Focused regression
        run: cargo test --locked -p neqo-qpack required_insert_count_uses_peer_capacity
      - name: QPACK tests
        run: cargo test --locked -p neqo-qpack
      - name: Original modulus regression control
        shell: bash
        run: |
          trap 'git checkout -- neqo-qpack/src/encoder.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('neqo-qpack/src/encoder.rs')
          s = p.read_text()
          old = 'self.peer_max_table_size / to_u64(ADDITIONAL_TABLE_ENTRY_SIZE)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'self.table.capacity() / to_u64(ADDITIONAL_TABLE_ENTRY_SIZE)'))
          PY
          set +e
          cargo test --locked -p neqo-qpack required_insert_count_uses_peer_capacity > /tmp/qpack-control.log 2>&1
          result=$?
          set -e
          cat /tmp/qpack-control.log
          test "$result" -ne 0
          grep -F 'left: 1' /tmp/qpack-control.log
          grep -F 'right: 5' /tmp/qpack-control.log
